name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q

      # The served stylesheet is a build artefact that lives in the repository.
      # Without this check a template can gain a class, nobody rebuilds, and
      # the next person to pull ships a page with missing styles — a failure
      # that is invisible until somebody looks at the screen.
      - name: Stylesheet is current
        run: |
          scripts/build-css.sh /tmp/app.css
          diff -u src/promptheus/static/app.css /tmp/app.css \
            || { echo "::error::app.css is stale — run scripts/build-css.sh and commit"; exit 1; }
