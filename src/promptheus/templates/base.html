<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Promptheus{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css" />
    <!-- Vendored, not from a CDN: this is a local tool and should work offline. -->
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/htmx-ext-sse.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body class="px-6 pb-16">
    <header class="pt-8 pb-4">
      <h1 class="text-[1.6rem] font-bold tracking-tight">Promptheus</h1>
      <p class="mt-1 text-muted">One prompt, many models, side by side.</p>
    </header>
    <main class="mx-auto max-w-[1400px]">{% block content %}{% endblock %}</main>
  </body>
</html>
