[project]
name = "promptheus"
version = "0.1.0.dev0"
description = "Send one prompt and files to several OpenRouter models and compare the answers"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "tiktoken>=0.7",
  "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptheus = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Code blocks in the plan documents are illustrative sketches, some of them
# deliberately incomplete. Keep the formatter out of the prose.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]  # allow explicit Any where it is genuinely needed

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # type annotations are noise in test bodies

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
# No per-package overrides: httpx, pydantic, pypdf, python-docx and tiktoken
# all ship py.typed, so silencing them would hide real errors.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
