# Named model sets, selectable with one click in the UI.
#
# Edit freely — this file is the fastest way to shape how you use Promptheus.
# Every id is validated against the live OpenRouter catalog at startup; unknown
# ids are reported and skipped rather than failing the app.
#
# Avoid floating aliases such as `~google/gemini-pro-latest`: they silently
# point at a different model when the vendor ships a new version, which makes
# past comparisons irreproducible. Pin explicit ids instead.

[flagships]
label = "Flagships (one per family)"
models = [
  "anthropic/claude-opus-5",
  "openai/gpt-5.6-sol",
  "google/gemini-3.1-pro-preview",
  "x-ai/grok-4.5",
  "moonshotai/kimi-k3",
  "qwen/qwen3.7-max",
  "nvidia/nemotron-3-ultra-550b-a55b",
  "deepseek/deepseek-v4-pro",
  "z-ai/glm-5.2",
]

[anthropic]
label = "Anthropic — Claude"
models = ["anthropic/claude-opus-5", "anthropic/claude-sonnet-5"]

[openai]
label = "OpenAI — GPT"
models = ["openai/gpt-5.6-sol", "openai/gpt-5.6-terra", "openai/gpt-5.6-luna"]

[google]
label = "Google — Gemini"
# gemini-3.1-pro is preview-only for now; it is the family's top text model.
models = ["google/gemini-3.1-pro-preview", "google/gemini-3.6-flash"]

[xai]
label = "xAI — Grok"
models = ["x-ai/grok-4.5", "x-ai/grok-4.3"]

[moonshotai]
label = "MoonshotAI — Kimi"
models = ["moonshotai/kimi-k3", "moonshotai/kimi-k2.7-code"]

[qwen]
label = "Qwen"
models = ["qwen/qwen3.7-max", "qwen/qwen3.7-plus"]

[nvidia]
label = "NVIDIA — Nemotron"
models = ["nvidia/nemotron-3-ultra-550b-a55b", "nvidia/nemotron-3-super-120b-a12b"]

[deepseek]
label = "DeepSeek"
models = ["deepseek/deepseek-v4-pro", "deepseek/deepseek-v4-flash"]

[zai]
label = "Z.AI — GLM"
models = ["z-ai/glm-5.2", "z-ai/glm-5.1"]
